name = "properties-service"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "PROPERTIES_DB"
database_name = "properties-db"
database_id = "placeholder-replace-with-actual-id"

[env.sit]
name = "properties-service-sit"
[[env.sit.d1_databases]]
binding = "PROPERTIES_DB"
database_name = "properties-db-sit"
database_id = "placeholder-sit-properties-db-id"

[env.uat]
name = "properties-service-uat"
[[env.uat.d1_databases]]
binding = "PROPERTIES_DB"
database_name = "properties-db-uat"
database_id = "placeholder-uat-properties-db-id"

[env.prod]
name = "properties-service-prod"
[[env.prod.d1_databases]]
binding = "PROPERTIES_DB"
database_name = "properties-db-prod"
database_id = "placeholder-prod-properties-db-id"
