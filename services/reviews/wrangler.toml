name = "reviews-service"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "REVIEWS_DB"
database_name = "reviews-db"
database_id = "placeholder-replace-with-actual-id"

[env.sit]
name = "reviews-service-sit"
[[env.sit.d1_databases]]
binding = "REVIEWS_DB"
database_name = "reviews-db-sit"
database_id = "placeholder-sit-reviews-db-id"

[env.uat]
name = "reviews-service-uat"
[[env.uat.d1_databases]]
binding = "REVIEWS_DB"
database_name = "reviews-db-uat"
database_id = "placeholder-uat-reviews-db-id"

[env.prod]
name = "reviews-service-prod"
[[env.prod.d1_databases]]
binding = "REVIEWS_DB"
database_name = "reviews-db-prod"
database_id = "placeholder-prod-reviews-db-id"
