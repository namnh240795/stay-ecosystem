name: Deploy to Production

on:
  push:
    branches:
      - prod

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Build
        run: pnpm turbo build

  approve:
    name: Approve Production Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approval confirmed
        run: echo "Production deployment approved."

  migrate-d1:
    name: Migrate D1
    needs: approve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 Migrations
        run: |
          for service in users properties bookings payments reviews; do
            cd services/$service
            wrangler d1 migrations apply ${{ env.DB_NAME }} --env prod --remote
            cd ../..
          done

  deploy-services:
    name: Deploy Services
    needs: migrate-d1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Services
        run: |
          for service in auth users properties bookings payments reviews; do
            cd services/$service
            wrangler deploy --env prod
            cd ../..
          done

  deploy-gateway:
    name: Deploy Gateway
    needs: deploy-services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Gateway
        run: |
          cd gateway
          wrangler deploy --env prod

  deploy-apps:
    name: Deploy Apps
    needs: deploy-gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Apps
        run: pnpm turbo build

      - name: Deploy to Cloudflare Pages
        run: |
          for app in apps/*/; do
            if [ -d "$app/dist" ] || [ -d "$app/build" ]; then
              appName=$(basename $app)
              npx wrangler pages deploy ${app}dist --project-name="${appName}-prod"
            fi
          done

  create-release:
    name: Create Release
    needs: deploy-apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          tag="release-$(date +%Y%m%d)-${{ steps.vars.outputs.sha }}"
          gh release create "$tag" \
            --title "Production Release $tag" \
            --notes "Automated production deployment from commit ${{ github.sha }}" \
            --target "${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Deployment Status
    needs: [build, approve, migrate-d1, deploy-services, deploy-gateway, deploy-apps, create-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          echo "=== Deployment Summary ==="
          echo "Build: ${{ needs.build.result }}"
          echo "Approval: ${{ needs.approve.result }}"
          echo "D1 Migrations: ${{ needs.migrate-d1.result }}"
          echo "Services: ${{ needs.deploy-services.result }}"
          echo "Gateway: ${{ needs.deploy-gateway.result }}"
          echo "Apps: ${{ needs.deploy-apps.result }}"
          echo "Release: ${{ needs.create-release.result }}"
          if [ "${{ needs.create-release.result }}" = "success" ]; then
            echo "Production deployment completed successfully."
          else
            echo "Production deployment failed."
            exit 1
          fi
